:root{--pink:#F386A1;--ink:#1E1E1E;--grey:#DEDEDE;--paper:#FEFEFE}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:640px;overflow:hidden;background:var(--pink)}
body{position:relative;color:var(--ink);font-family:VT323,"JetBrains Mono",monospace}
.frame{position:absolute;inset:30px 34px;border:1px solid var(--ink);overflow:hidden}
.texture{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;top:18px;left:18px;padding:3px 9px;background:var(--ink);color:var(--pink);font-size:24px;line-height:26px;letter-spacing:1px;border:1px dotted var(--pink);outline:1px solid var(--ink)}
.mark{position:absolute;width:10px;height:10px;border:0 solid var(--ink)}
.tl{left:12px;top:10px;border-left-width:1px;border-top-width:1px}.tr{right:12px;top:10px;border-right-width:1px;border-top-width:1px}.bl{left:12px;bottom:10px;border-left-width:1px;border-bottom-width:1px}.br{right:12px;bottom:10px;border-right-width:1px;border-bottom-width:1px}
h1{position:absolute;left:68px;top:211px;font-family:Inter,sans-serif;font-weight:700;font-size:96px;line-height:1.1;letter-spacing:-.05em}
.win{position:absolute;left:603px;top:113px;width:364px;border:1px solid var(--ink);background:var(--grey);box-shadow:inset 0 0 0 2px var(--paper),3px 3px 0 var(--ink)}
.bar{display:flex;justify-content:space-between;padding:4px 9px;background:var(--ink);color:var(--paper);font-size:24px;line-height:25px}
.body{padding:16px}
.sudoku{display:grid;grid-template-columns:repeat(9,36px);grid-template-rows:repeat(9,36px);width:328px;border:2px solid var(--ink);background:var(--paper)}
.cell{display:grid;place-items:center;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);font-size:30px;line-height:1}
.cell:nth-child(9n){border-right:0}.cell:nth-child(n+73){border-bottom:0}
.box-right{border-right:3px solid var(--ink)}.box-bottom{border-bottom:3px solid var(--ink)}
.selected{background:var(--ink);color:var(--paper)}
.prob{margin-top:12px;border-top:1px dotted var(--ink);padding-top:8px;font-size:26px;line-height:28px;white-space:pre}
.mascot{position:absolute;left:1010px;top:279px}.robot{display:block;width:172px;height:132px}
footer{position:absolute;left:68px;bottom:51px;font-size:28px;line-height:30px;white-space:pre}
