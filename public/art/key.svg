<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" preserveAspectRatio="none" width="64" height="64">
  <!-- The #pressed fragment exposes the ink face for image consumers.
       A host button must set its own overlaid label to paper when pressed. -->
  <style>
    #pressed { display: none; }
    #pressed:target { display: inline; }
    svg:active .face { fill: #1E1E1E; }
    svg:active text { fill: #FEFEFE; }
  </style>
  <g shape-rendering="crispEdges">
    <rect x="3" y="3" width="61" height="61" fill="#1E1E1E"/>
    <rect width="61" height="61" fill="#1E1E1E"/>
    <rect class="face" x="1" y="1" width="59" height="59" fill="#DEDEDE"/>
    <rect id="pressed" x="1" y="1" width="59" height="59" fill="#1E1E1E"/>
  </g>
</svg>
