services:
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/arcade.sqlite
    volumes:
      - arcade-data:/app/data
    expose:
      - "3000"
    restart: unless-stopped
    stop_grace_period: 61m
  caddy:
    image: caddy:2
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:?Set GAME_DOMAIN to your hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - app
volumes:
  arcade-data:
  caddy-data:
  caddy-config:
